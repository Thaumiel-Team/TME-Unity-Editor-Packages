name: Build Packages

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [AutoUpdater, Blocky, Collab, PMERConverter, ItemReferences, RoleReferences, RoomReferences]
    steps:
      - uses: actions/checkout@v4

      - name: List files to include
        run: |
          find "${{ matrix.package }}" -name '*.meta' > metaList
          echo "Including $(wc -l < metaList) meta files"
          test -s metaList || { echo "No .meta files found in ${{ matrix.package }}"; exit 1; }

      - name: Create ${{ matrix.package }}.unitypackage
        uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: ${{ matrix.package }}.unitypackage
          include-files: metaList

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}.unitypackage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.unitypackage