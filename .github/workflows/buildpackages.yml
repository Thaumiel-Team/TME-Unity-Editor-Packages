name: Build Packages

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [AutoUpdater, Blocky, Collab, PMERConverter, ItemReferences, RoleReferences, RoomReferences]
    steps:
      - uses: actions/checkout@v4

      - name: List files to include
        run: |
          find "${{ matrix.package }}" -name '*.meta' > metaList
          echo "Including $(wc -l < metaList) meta files"
          test -s metaList || { echo "No .meta files found in ${{ matrix.package }}"; exit 1; }

      - name: Create ${{ matrix.package }}.unitypackage
        uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: ${{ matrix.package }}.unitypackage
          include-files: metaList

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package }}.unitypackage
          fail_on_unmatched_files: true